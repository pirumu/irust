\* TLC configuration for AtLeastOnce.tla with Dedup = TRUE (run pcal.trans first). Not run by the author.
\* Expected: no error. CHECK_DEADLOCK FALSE: once the message is acknowledged nothing can move
\* and the broker's loop never terminates, so TLC would report a deadlock.
SPECIFICATION Spec
CONSTANTS
  Msgs = {m1}
  Consumers = {c1, c2}
  NULL = NULL
  Dedup = TRUE
  MaxCrashes = 2
INVARIANTS TypeOK AtMostOneEffect EffectsIffSeen
CHECK_DEADLOCK FALSE
