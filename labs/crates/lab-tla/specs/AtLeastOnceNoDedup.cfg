\* TLC configuration for AtLeastOnce.tla with Dedup = FALSE and two consumers but no crash at all.
\* Not run by the author. Expected: invariant AtMostOneEffect is violated; the visibility timeout
\* alone is enough (a shortest error trace has 6 states: Receive, Redeliver, Handle, Receive, Handle
\* in some order that TLC picks).
SPECIFICATION Spec
CONSTANTS
  Msgs = {m1}
  Consumers = {c1, c2}
  NULL = NULL
  Dedup = FALSE
  MaxCrashes = 0
INVARIANTS TypeOK AtMostOneEffect
CHECK_DEADLOCK FALSE
