\* TLC configuration for TCommit.tla, the specification (Buggy = FALSE). Not run by the author.
\* Expected: no error. CHECK_DEADLOCK FALSE because "all committed" and "all aborted" have no step.
\* The state counts of this model are reproduced by `cargo run -q -p lab-tla --bin calibrate`.
SPECIFICATION TCSpec
CONSTANTS
  RM = {r1, r2, r3}
  Buggy = FALSE
INVARIANTS TCTypeOK TCConsistent
CHECK_DEADLOCK FALSE
