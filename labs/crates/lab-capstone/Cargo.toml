[package]
name = "lab-capstone"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "P7 capstone: HTTP/1.1 server on raw epoll, then the same server on a hand-written async runtime"

# libc is only used by the Linux-only code (epoll, accept4, fcntl); the HTTP parser and the
# load client are plain std and also build on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
