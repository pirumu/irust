[package]
name = "lab-containers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Phase 8 labs: namespaces, cgroup v2 limits, a mini container and PID 1 signals on Linux"

# Every lab is Linux-only; on other targets each binary just prints how to run it in the container.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
