[package]
name = "lab-linux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Phase 1 labs: processes, file descriptors, system calls, /proc and strace on Linux"

# Every lab is Linux-only; on other targets each binary just prints how to run it in the container.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
