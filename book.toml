[book]
title = "Rust Internals: nền tảng hệ thống cho backend engineer"
description = "Giáo trình tiếng Việt về OS, Linux, CPU, bộ nhớ, concurrency, lưu trữ, networking, async, container, Rust internals, hệ thống dữ liệu và TLA+. Mọi khẳng định có chú thích trích nguyên văn nguồn."
language = "vi"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["book-assets/mermaid.min.js", "book-assets/mermaid-init.js", "book-assets/mathjax-dollar.js"]
mathjax-support = true
no-section-label = true
git-repository-url = "https://github.com/pirumu/irust"
edit-url-template = "https://github.com/pirumu/irust/edit/main/{path}"

[output.html.search]
limit-results = 40
